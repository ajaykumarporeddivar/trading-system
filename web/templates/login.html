<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Crypto Trading Arena V11</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="login-page">
    <div class="login-overlay">
        <div class="login-box">
            <div class="login-logo">◈</div>
            <h1>Crypto Trading Arena V11</h1>
            <p class="login-subtitle">Institutional Command Center</p>
            <form id="loginForm">
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off" required autofocus>
                </div>
                <button type="submit" class="login-btn">Authenticate</button>
                <div id="loginError" class="error"></div>
            </form>
            <p class="login-footer">Secured with JWT · Session expires after inactivity</p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password})
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/';
                } else {
                    errorEl.textContent = data.error || 'Authentication failed';
                }
            } catch (err) {
                errorEl.textContent = 'Connection error';
            }
        });
    </script>
</body>
</html>
